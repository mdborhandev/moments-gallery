<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Love Story</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exifr/7.1.3/lite.umd.js"></script>
</head><body>

<section id="login"><form id="lf" autocomplete="off">
<div class="hb" aria-hidden="true">♥</div><h1>Our love story</h1><p>Enter the password to open our memories.</p>
<input id="pw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password" autofocus>
<button class="pri" type="submit">Unlock</button><div id="err" role="alert"></div></form></section>

<div id="app" hidden>
<header>
<div class="row"><h2>Our love story</h2>
<button id="rs" class="pri">Rescan</button>
<button id="selb">Select</button><button id="vw">Timeline</button><button id="th">Theme</button><button id="pwb">Password</button><button id="out">Log out</button></div>
<div class="row"><input id="q" type="search" placeholder="Search filename, tag, place, event or notes" aria-label="Search"></div>
<div class="row">
<select id="fy" aria-label="Year"></select><select id="fm" aria-label="Month"></select>
<select id="fc" aria-label="Camera"></select><select id="fe" aria-label="Event"></select>
<input id="d1" type="date" aria-label="From"><input id="d2" type="date" aria-label="To">
<button id="ff">Favorites</button>
<select id="so" aria-label="Sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="up">Recently uploaded</option><option value="name">Filename</option></select>
<button id="clr">Clear filters</button><span id="count"></span></div>
</header>
<main><div id="grid"></div><div id="empty" hidden></div><div id="more"></div></main>
<div id="bar" hidden><span id="bn"></span><button id="bt">Add tags</button><button id="be">Set event</button><button id="bf">Favorite</button><button id="bd">Hide</button><button id="bx">Done</button></div>
</div>

<div id="lb" hidden>
<div id="stage"><img id="im" alt=""></div>
<button class="nav" id="pv" aria-label="Previous">‹</button><button class="nav" id="nx" aria-label="Next">›</button>
<aside id="panel">
<div class="row"><button id="lf2">♡ Favorite</button><button id="dl">Download</button><button id="rm">Hide</button><button id="cl">Close</button></div>
<label>Tags (comma separated)<input id="mt"></label>
<label>Place<input id="mp"></label>
<label>Event<input id="me"></label>
<label>Date taken<input id="md" type="datetime-local"></label>
<label>Notes<textarea id="mn" rows="3"></textarea></label>
<button class="pri" id="sv">Save details</button>
<dl id="info"></dl></aside></div>
<div id="toast" hidden></div>

<script src="script.js" defer></script></body></html>
